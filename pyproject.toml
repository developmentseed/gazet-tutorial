[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gazet-tutorial"
version = "0.2.0"
description = "Tutorial: fine-tune a small LLM for natural-language geocoding (simplified gazet, India only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "sqlparse>=0.5",
    "geopandas>=1.0",
    "shapely>=2.0",
    "folium>=0.17",
    "matplotlib>=3.8",
    "mapclassify>=2.8",
]

[project.optional-dependencies]
# Local playground (app/playground.py). Model conversion is done with llama.cpp's own
# tooling, see docs/take-it-home.md, so nothing heavy is needed here.
app = [
    "streamlit>=1.40",
    "streamlit-folium>=0.22",
]
# Hyperparameter runs on Modal with local trackio logging (experiments/README.md).
experiments = [
    "modal>=1.6",
    "hydra-core>=1.3",
    "hydra-joblib-launcher>=1.2",
    "trackio>=0.42",
]
dev = [
    "pytest>=8",
    "papermill>=2.6",
    "jupytext>=1.16",
    "nbformat>=5.10",
    "ipykernel",
    "ruff",
    "transformers>=4.51",
    "tokenizers",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gazet_tutorial"]

# Bundle the pre-built dataset and relation tables into the wheel so a
# `pip install git+...` in Colab carries the fallback artifacts (no accounts needed).
[tool.hatch.build.targets.wheel.force-include]
"artifacts" = "gazet_tutorial/artifacts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"
builtins = ["display"]          # notebooks call IPython's display()

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks/src/*" = ["E402", "E702", "I001", "B018"]
"scripts/*" = ["E402"]
"experiments/*" = ["E402"]
"app/*" = ["E402"]
